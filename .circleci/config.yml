version: 2.1

jobs:
  deploy-supabase:
    docker:
      - image: cimg/node:24.21.0
    resource_class: small
    steps:
      - checkout

      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-

      - run:
          name: Install dependencies
          command: npm ci

      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

      - run:
          name: Check Supabase deployment variables
          command: |
            for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD; do
              if [ -z "$(printenv "$name")" ]; then
                echo "$name is not configured in CircleCI."
                exit 1
              fi
            done

      - run:
          name: Link Supabase project
          command: |
            npx supabase link \
              --yes \
              --project-ref "$SUPABASE_PROJECT_REF" \
              --password "$SUPABASE_DB_PASSWORD"

      - run:
          name: Apply database migrations
          command: |
            npx supabase db push \
              --yes \
              --linked \
              --password "$SUPABASE_DB_PASSWORD"

      - run:
          name: Deploy image worker
          command: |
            npx supabase functions deploy imagen-mcp-worker \
              --yes \
              --project-ref "$SUPABASE_PROJECT_REF" \
              --use-api \
              --no-verify-jwt

      - run:
          name: Deploy MCP endpoint
          command: |
            npx supabase functions deploy imagen-mcp \
              --yes \
              --project-ref "$SUPABASE_PROJECT_REF" \
              --use-api \
              --no-verify-jwt

workflows:
  deploy:
    jobs:
      - deploy-supabase:
          filters:
            branches:
              only: main
